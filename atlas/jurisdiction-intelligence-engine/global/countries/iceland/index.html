<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="alternate icon" href="/assets/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#b91c1c">
<title>Iceland | Satoshium Atlas</title>
<meta name="description" content="Temporary global country page for Satoshium Atlas.">
<style>
:root{
 --bg:#07090d;
 --panel:#0c1018;
 --text:#e8edf7;
 --muted:#9aa7bd;
 --gold:#d6a34a;
 --gold2:#f4c36a;
}
body{
 margin:0;
 padding-top:80px;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
.wrap{max-width:980px;margin:auto;padding:34px 18px}
.card{
 background:rgba(12,16,24,.95);
 border:1px solid rgba(214,163,74,.15);
 border-radius:18px;
 padding:24px;
}
.eyebrow{
 padding:8px 14px;
 border:1px solid rgba(214,163,74,.24);
 border-radius:999px;
 color:var(--gold2);
 font-size:13px;
 font-weight:700;
 letter-spacing:.08em;
 text-transform:uppercase;
 display:inline-block;
}
h1{color:var(--gold2)}
.muted{color:var(--muted)}
.btn{
 display:inline-block;
 margin:10px 10px 0 0;
 padding:12px 16px;
 border-radius:12px;
 border:1px solid rgba(214,163,74,.24);
 background:rgba(214,163,74,.06);
 color:var(--gold2);
 font-weight:700;
 text-decoration:none;
}
</style>
</head>
<body>

<div id="topbar-slot" data-topbar="universe"></div>
<script src="/components/topbar-loader.js"></script>

<main class="wrap">
<article class="card">
<div class="eyebrow">Atlas · Global Country Page</div>
<h1>Iceland</h1>

<p class="muted">
This Atlas global jurisdiction page is being prepared for structured package publication.
Canonical package layers and public-facing interpretation surfaces are still in development.
</p>

<a class="btn" href="/atlas/">Back to Atlas →</a>
<a class="btn" href="/atlas/jurisdiction-intelligence-engine/">Open Jurisdiction Intelligence Engine →</a>

</article>
</main>

<div id="footer-container"></div>

<script>
fetch("https://satoshium.link/components/footer.html")
.then(r=>r.text())
.then(d=>{document.getElementById("footer-container").innerHTML=d});
</script>

</body>
</html>
