<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1312 582" width="1312" height="582" role="img" aria-labelledby="title desc">
<title id="title">Satoshium Atlas U.S. State Tile Map</title>
<desc id="desc">Clickable tile map of U.S. states. Bright states have completed jurisdiction pages.</desc>
<style>
:root {
  --bg:#07090d;
  --panel:#0c1018;
  --text:#e8edf7;
  --muted:#9aa7bd;
  --gold:#d6a34a;
  --gold2:#f4c36a;
  --line:rgba(214,163,74,.18);
  --done-fill:#1b2535;
  --done-stroke:#d6a34a;
  --done-text:#f4c36a;
  --todo-fill:#101624;
  --todo-stroke:rgba(214,163,74,.12);
  --todo-text:#76829a;
}
svg {
  background: var(--bg);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
}
.frame {
  fill: var(--panel);
  stroke: var(--line);
  stroke-width: 1;
  rx: 22;
}
.state-link text, .state-group text {
  pointer-events:none;
}
.state-link .tile {
  fill: var(--done-fill);
  stroke: var(--done-stroke);
  stroke-width: 1.5;
  rx: 12;
  transition: transform .18s ease, fill .18s ease, stroke .18s ease;
}
.state-link:hover .tile {
  fill: #22314a;
  transform: translateY(-2px);
}
.state-link .abbr {
  fill: var(--done-text);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .04em;
  text-anchor: middle;
}
.state-link .name {
  fill: var(--text);
  font-size: 10px;
  text-anchor: middle;
}
.state-group .tile {
  fill: var(--todo-fill);
  stroke: var(--todo-stroke);
  stroke-width: 1.2;
  rx: 12;
}
.state-group .abbr {
  fill: var(--todo-text);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .04em;
  text-anchor: middle;
}
.state-group .name {
  fill: var(--todo-text);
  font-size: 10px;
  text-anchor: middle;
}
.legend-label {
  fill: var(--muted);
  font-size: 13px;
}
.legend-title {
  fill: var(--gold2);
  font-size: 14px;
  font-weight: 700;
}
.small {
  fill: var(--muted);
  font-size: 12px;
}
</style>

<rect class="frame" x="1" y="1" width="1310" height="580" rx="22" />
<text x="30" y="20" class="legend-title">Atlas U.S. State Tile Map</text>
<text x="30" y="558" class="small">Tile map for navigation now; replace later with a geographic SVG without changing the state links.</text>

