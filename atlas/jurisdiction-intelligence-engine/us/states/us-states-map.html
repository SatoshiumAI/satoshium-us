  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 24px 16px 40px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      color: #f0c040;
      font-size: clamp(1.2rem, 3vw, 2rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    header p {
      color: #aaa;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    #map-container {
      position: relative;
      width: 100%;
      max-width: 960px;
    }
    #map-container svg {
      width: 100%;
      height: auto;
      display: block;
    }
    /* State paths – base style */
    #map-container svg path.clickable-state {
      cursor: pointer;
      transition: opacity 0.15s ease, filter 0.15s ease;
    }
    #map-container svg path.clickable-state:hover {
      opacity: 0.65;
      filter: brightness(1.4) drop-shadow(0 0 6px rgba(255,210,80,0.7));
    }
    /* Tooltip */
    #tooltip {
      position: fixed;
      background: rgba(10,10,20,0.92);
      border: 1px solid #f0c040;
      color: #f0c040;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      pointer-events: none;
      white-space: nowrap;
      display: none;
      z-index: 9999;
      letter-spacing: 0.04em;
    }
    footer {
      color: #555;
      font-size: 0.78rem;
      margin-top: 16px;
      text-align: center;
    }
    footer a { color: #888; }
  </style>

  "Minnesota": { url: "https://satoshium.us/atlas/jurisdiction-intelligence-engine/us/states/minnesota/", x: 473.73, y: 176.62 },
  "Montana": { url: "https://satoshium.us/atlas/jurisdiction-intelligence-engine/us/states/montana/", x: 263.50, y: 115.69 },
  "North Dakota": { url: "https://satoshium.us/atlas/jurisdiction-intelligence-engine/us/states/north-dakota/", x: 362.22, y: 133.32 },
  "Arizona": { url: "https://satoshium.us/atlas/jurisdiction-intelligence-engine/us/states/arizona/", x: 204.84, y: 332.96 },
  "Utah": { url: "https://satoshium.us/atlas/jurisdiction-intelligence-engine/us/states/utah/", x: 232.37, y: 253.50 },
  "Hawaii": { url: "https://satoshium.us/atlas/jurisdiction-intelligence-engine/us/states/hawaii/", x: 286.84, y: 513.55 },
  "Alaska": { url: "https://satoshium.us/atlas/jurisdiction-intelligence-engine/us/states/alaska/", x: 167.29, y: 481.00 }
};
 
    // ── Build hit-test mapping via canvas isPointInPath ───────────────────
    const svg = document.querySelector('#map-container svg');
    const vb  = svg.viewBox.baseVal;   // { x, y, width, height }
 
    // We need a canvas at the same intrinsic size as the SVG viewBox
    const canvas = document.createElement('canvas');
    canvas.width  = vb.width;
    canvas.height = vb.height;
    const ctx = canvas.getContext('2d');
 
    // Collect all non-transparent paths
    const allPaths = Array.from(svg.querySelectorAll('path')).filter(p => {
      const cls = p.getAttribute('class') || '';
      return cls !== 'st0';
    });
 
    // Map from SVG path element → state name
    const pathToState = new Map();
    // Map from state name → SVG path element (for multi-segment states like Michigan)
    const stateToPath = new Map();
 
    // For each state, find which path(s) contain its label position
    for (const [stateName, info] of Object.entries(stateData)) {
      const tx = info.x;
      const ty = info.y;
 
      let matched = null;
      // Try exact point first, then spiral outward to handle label offsets
      const offsets = [
        [0,0],[5,5],[-5,5],[5,-5],[-5,-5],
        [10,0],[-10,0],[0,10],[0,-10],
        [15,10],[15,-10],[-15,10],[-15,-10],
        [20,20],[-20,20],[20,-20],[-20,-20],
        [30,0],[-30,0],[0,30],[0,-30],
        [40,15],[40,-15],[-40,15],[-40,-15],
        [0,40],[0,-40]
      ];
 
      for (const [dx, dy] of offsets) {
        const testX = tx + dx;
        const testY = ty + dy;
        for (const pathEl of allPaths) {
          if (pathToState.has(pathEl) && pathToState.get(pathEl) !== stateName) continue;
          const d = pathEl.getAttribute('d');
          try {
            const p2d = new Path2D(d);
            if (ctx.isPointInPath(p2d, testX, testY)) {
              matched = pathEl;
              break;
            }
          } catch(e) { /* skip malformed paths */ }
        }
        if (matched) break;
      }
 
      if (matched) {
        pathToState.set(matched, stateName);
        stateToPath.set(stateName, matched);
      }
    }
 
    // Logging for debug (open browser console to view)
    console.log('[Satoshium Map] Matched states:', stateToPath.size, '/ 50');
    for (const [s, p] of stateToPath.entries()) {
      console.log('  ', s, '→', p.getAttribute('class'));
    }
    const unmatched = Object.keys(stateData).filter(s => !stateToPath.has(s));
    if (unmatched.length) console.warn('[Satoshium Map] Unmatched:', unmatched);
 
    // ── Wire up interaction ───────────────────────────────────────────────
    const tooltip = document.getElementById('tooltip');
 
    for (const [pathEl, stateName] of pathToState.entries()) {
      pathEl.classList.add('clickable-state');
      pathEl.setAttribute('role', 'link');
      pathEl.setAttribute('aria-label', stateName);
      pathEl.style.cursor = 'pointer';
 
      pathEl.addEventListener('click', () => {
        window.open(stateData[stateName].url, '_blank', 'noopener,noreferrer');
      });
 
      pathEl.addEventListener('mouseenter', (e) => {
        tooltip.textContent = stateName;
        tooltip.style.display = 'block';
      });
 
      pathEl.addEventListener('mousemove', (e) => {
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top  = (e.clientY - 28) + 'px';
      });
 
      pathEl.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });
    }
 
  })();
  </script>
